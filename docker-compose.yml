version: '3.8'

services:
  postgres:
    image: postgis/postgis:14-3.3
    environment:
      POSTGRES_USER: indra
      POSTGRES_PASSWORD: indra123
      POSTGRES_DB: indra
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  server:
    build: ./server
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://indra:indra123@postgres:5432/indra
      REDIS_URL: redis://redis:6379
      SECRET_KEY: change-this-in-production
      AI_ENGINE_URL: http://ai-engine:8001
    depends_on:
      - postgres
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  ai-engine:
    build: ./ai-engine
    ports:
      - "8001:8001"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001

  client:
    build: ./client
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_AI_ENGINE_URL: http://localhost:8001
    depends_on:
      - server
      - ai-engine

volumes:
  postgres_data:
